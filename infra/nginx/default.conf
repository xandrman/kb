# HTTP: в clear остаётся только ACME-челлендж, остальное улетает на HTTPS
server {
    listen       80;
    server_name  ${domain_name};

    # ACME HTTP-01 (Let's Encrypt): файл челленджа должен оставаться доступным по HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: встроенная заглушка nginx, пока приложение отключено
server {
    listen       443 ssl;
    server_name  ${domain_name};

    ssl_certificate     /etc/letsencrypt/live/${domain_name}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${domain_name}/privkey.pem;

    otel_trace         on;
    otel_trace_context propagate;

    root  /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}

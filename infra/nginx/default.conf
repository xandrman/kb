server {
    listen       80;
    server_name  ${domain_name};

    otel_trace         on;
    otel_trace_context propagate;

    # Код запечён в образ kb-app; nginx видит только public/ по общему тому kb-app-public
    root  /var/www/html/public;
    index index.php;

    # Загрузка документов (ТЗ 6.2); согласовано с post_max_size в infra/php-fpm/zz-kb.ini
    client_max_body_size 128m;

    # ACME HTTP-01 (Let's Encrypt): nginx отдаёт файл челленджа из общего webroot, в который пишет certbot
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ADR-0023: на маршруте MCP буферизация и сжатие ломают поток SSE — TTFT ≤ 5 с (ТЗ 6.1) не выполняется
    location /mcp {
        include fastcgi_params;

        set $upstream_app kb-app:9000;
        fastcgi_pass $upstream_app;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;

        fastcgi_buffering    off;
        gzip                 off;
        fastcgi_read_timeout 60s;
    }

    location = /index.php {
        include fastcgi_params;

        set $upstream_app kb-app:9000;
        fastcgi_pass $upstream_app;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;

        # ADR-0023: больше бюджета полного ответа 30 с (ТЗ 6.1)
        fastcgi_read_timeout 60s;
    }

    # Наружу отдаётся единственная точка входа
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# Вход в Laravel (kb-app) по HTTP. Сервер по умолчанию на :80 — default.conf: он подключается раньше по алфавиту
server {
    listen       80;
    server_name  kb-nginx;

    # :80 опубликован наружу, поэтому доступ ограничен клиентами kb-internal (ТЗ 6.4).
    # Шлюз сети — это хост, а не контейнер, его отсекаем явно
    deny  ${internal_gateway};
    allow ${internal_subnet};
    deny  all;

    root  /var/www/html/public;
    index index.php;

    otel_trace         on;
    otel_trace_context propagate;

    client_max_body_size 64m;

    set $upstream_app kb-app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ADR-0023: SSE не копится в буфере nginx, иначе TTFT ≤ 5 с (ТЗ 6.1) не выполняется
    location = /mcp {
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_pass  $upstream_app;

        fastcgi_buffering    off;
        gzip                 off;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        try_files     $uri =404;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass  $upstream_app;

        # ADR-0023: больше бюджета полного ответа 30 с (ТЗ 6.1), согласовано с request_terminate_timeout
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# Вход в Laravel (kb-app) снаружи: админ-панель (FR-1) по TLS (ТЗ 6.4)
server {
    listen       8001 ssl;
    server_name  ${domain_name};

    ssl_certificate     /etc/letsencrypt/live/${domain_name}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${domain_name}/privkey.pem;

    # Plain HTTP на TLS-порт: вместо 400 уводим на тот же адрес по HTTPS
    error_page 497 =301 https://$host:8001$request_uri;

    root  /var/www/html/public;
    index index.php;

    otel_trace         on;
    otel_trace_context propagate;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 64m;

    set $upstream_app kb-app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # MCP-клиент (LibreChat) и backchannel logout Keycloak ходят только изнутри kb-internal через :80
    location ~ ^/mcp(/|$) {
        return 404;
    }

    location ~ \.php$ {
        try_files     $uri =404;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # fastcgi_params не передаёт схему: без HTTPS Laravel строит ссылки и редиректы на http://
        fastcgi_param HTTPS           on;
        fastcgi_pass  $upstream_app;

        # ADR-0023: больше бюджета полного ответа 30 с (ТЗ 6.1), согласовано с request_terminate_timeout
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

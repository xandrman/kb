version: 1.3.13

cache: true

endpoints:
  custom:
    # Единственный провайдер модели — kb-vllm-generate внутри kb-internal (ADR-0024).
    # vLLM запущен без --api-key, ключ — заглушка; имя модели задано --served-model-name.
    - name: "kb-vllm-generate"
      apiKey: "vllm"
      baseURL: "http://kb-vllm-generate:8000/v1"
      models:
        default: ["default"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      titleMessageRole: "user"
      modelDisplayLabel: "kb"

# MCP-сервер Laravel (kb-app) за внутренним vhost kb-nginx, доступен только из kb-internal (ТЗ 6.4)
mcpServers:
  kb:
    type: streamable-http
    url: "http://kb-nginx/mcp"
    # title пропускает только [a-zA-Z0-9 ]
    title: "Knowledge Base"
    serverInstructions: true
    # OAuth MCP через тот же клиент kb-app, что и вход в LibreChat: токен и SSO-сессия принадлежат kb-app,
    # поэтому backchannel logout Keycloak доходит до kb-app; права определяет kb-app по подписи токена (FR-7).
    # С client_secret LibreChat требует явные authorization_url и token_url; секрет подставляет LibreChat из env.
    # Метаданные Keycloak при этом не читаются: без явного revocation_endpoint revoke уходит на /revoke MCP-сервера
    requiresOAuth: true
    oauth:
      client_id: "kb-app"
      client_secret: "$${OPENID_CLIENT_SECRET}"
      authorization_url: "https://${domain_name}:8002/realms/kb/protocol/openid-connect/auth"
      token_url: "https://${domain_name}:8002/realms/kb/protocol/openid-connect/token"
      revocation_endpoint: "https://${domain_name}:8002/realms/kb/protocol/openid-connect/revoke"
      revocation_endpoint_auth_methods_supported: ["client_secret_basic"]
      scope: "openid profile email"

# Строгий белый список: SSRF-защита LibreChat по умолчанию блокирует внутренние имена вроде kb-nginx.
# domain_name внутри kb-internal — алиас kb-nginx, через него LibreChat ходит в Keycloak за токеном
mcpSettings:
  allowedDomains:
    - "kb-nginx"
    - "${domain_name}"

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "vllm"
    static_configs:
      - targets:
          - "kb-vllm-generate:8000"
          - "kb-vllm-embedding:8000"
          - "kb-vllm-reranker:8000"

  - job_name: "qdrant"
    static_configs:
      - targets: ["kb-qdrant:6333"]

  - job_name: "tempo"
    static_configs:
      - targets: ["kb-tempo:3200"]

  - job_name: "loki"
    static_configs:
      - targets: ["kb-loki:3100"]

  - job_name: "grafana"
    static_configs:
      - targets: ["kb-grafana:3000"]

  - job_name: "alloy"
    static_configs:
      - targets: ["kb-alloy:12345"]

  - job_name: "dcgm"
    static_configs:
      - targets: ["kb-dcgm-exporter:9400"]

memory_limit = 256M
expose_php = Off

; ТЗ 6.2: документ до 100 страниц, включая сканы
upload_max_filesize = 128M
post_max_size = 128M

; ADR-0023: буферизация и сжатие ломают поток SSE — TTFT ≤ 5 с (ТЗ 6.1) не выполняется
output_buffering = Off
zlib.output_compression = Off

; Код запечён в образ, инвалидация по времени не нужна
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

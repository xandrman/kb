[www]
; Конфигурация приложения приходит только переменными окружения контейнера — без этого дочерние процессы их не видят
clear_env = no

; ADR-0023: процесс на соединение, предел конкурентности выражен числом процессов.
; 10 одновременных SSE (ТЗ 6.1) плюс резерв под админ-панель (ADR-0021); итоговое число — из Capacity Planning (ТЗ 7.10)
pm = static
pm.max_children = 16

; ADR-0023: больше бюджета полного ответа 30 с (ТЗ 6.1), иначе поток обрывается на границе бюджета
request_terminate_timeout = 60s

; ADR-0023: насыщение пула снимает Prometheus (ADR-0013)
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Логи приложения уходят в stderr контейнера, оттуда драйвером syslog Docker — в Alloy и Loki (ADR-0032)
catch_workers_output = yes
decorate_workers_output = no

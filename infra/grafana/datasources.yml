apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://kb-tempo:3200
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
    editable: false

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://kb-prometheus:9090
    jsonData:
      httpMethod: GET
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://kb-loki:3100
    jsonData:
      derivedFields:
        # trace_id Alloy кладёт в структурированные метаданные записи (ADR-0032)
        - datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          name: TraceID
          url: "$${__value.raw}"
    editable: false